{% extends 'base.html' %}{% block content %}
<h3>Supply Management</h3>
<form method="get" class="row g-2 mb-3">
<div class="col-md-5"><input name="q" class="form-control" placeholder="Search supplies"></div>
<div class="col-md-3"><select name="category" class="form-select"><option value="">All categories</option>{% for c in categories %}<option>{{c.name}}</option>{% endfor %}</select></div>
<div class="col-md-2"><button class="btn btn-primary">Filter</button></div>
</form>
<div class="card p-3 mb-3">
<h5>Add New Supply</h5>
<form method="post" class="row g-2">
<div class="col-md-2"><input name="item_id" class="form-control" placeholder="Item ID" required></div>
<div class="col-md-2"><input name="item_name" class="form-control" placeholder="Item Name" required></div>
<div class="col-md-2"><select name="category_id" class="form-select"><option value="">Category</option>{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div>
<div class="col-md-2"><input name="quantity" type="number" class="form-control" placeholder="Quantity"></div>
<div class="col-md-2"><input name="unit_price" type="number" step="0.01" class="form-control" placeholder="Unit Price"></div>
<div class="col-md-2"><input name="storage_location" class="form-control" placeholder="Storage"></div>
<div class="col-md-2"><button class="btn btn-primary">Add</button></div>
</form></div>
<table class="table table-bordered table-sm">
<tr><th>ID</th><th>Name</th><th>Category</th><th>Qty</th><th>Status</th><th>Supplier</th></tr>
{% for s in supplies %}<tr><td>{{s.item_id}}</td><td>{{s.item_name}}</td><td>{{s.category.name if s.category}}</td><td>{{s.quantity}}</td><td>{{s.status}}</td><td>{{s.supplier.name if s.supplier}}</td></tr>{% endfor %}
</table>
{% endblock %}
