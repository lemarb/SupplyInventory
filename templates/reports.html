{% extends 'base.html' %}{% block content %}
<h3>Reports</h3>
<div class="card p-3 mb-3">
  <h5>Generate Report Record</h5>
  <form method="post" class="row g-2">
    <div class="col-md-3">
      <select name="report_type" class="form-select">
        <option>Daily</option><option>Weekly</option><option selected>Monthly</option><option>Annual</option>
      </select>
    </div>
    <div class="col-md-3">
      <select name="format" class="form-select">
        <option>CSV</option><option>Excel</option><option>PDF</option>
      </select>
    </div>
    <div class="col-md-4"><input name="notes" class="form-control" placeholder="Notes"></div>
    <div class="col-md-2"><button class="btn btn-primary w-100">Create</button></div>
  </form>
</div>
<table class="table table-striped">
  <tr><th>Date</th><th>Type</th><th>Format</th><th>Generated By (User ID)</th><th>Notes</th></tr>
  {% for r in reports %}
  <tr><td>{{r.generated_at}}</td><td>{{r.report_type}}</td><td>{{r.format}}</td><td>{{r.generated_by}}</td><td>{{r.notes}}</td></tr>
  {% endfor %}
</table>
{% endblock %}
