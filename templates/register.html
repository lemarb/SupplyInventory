{% extends 'base.html' %}{% block content %}
<h3>Register User</h3>
<form method="post" class="row g-2">
<div class="col-md-4"><input name="username" class="form-control" placeholder="Username" required></div>
<div class="col-md-4"><input name="password" type="password" class="form-control" placeholder="Password" required></div>
<div class="col-md-3"><select name="role" class="form-select"><option>Admin</option><option>Inventory Staff</option><option>Viewer</option></select></div>
<div class="col-md-1"><button class="btn btn-primary">Save</button></div>
</form>
{% endblock %}
